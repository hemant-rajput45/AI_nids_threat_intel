<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI-Powered NIDS & Threat Intel{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom Cyber Dark Theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-dark-soc text-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary px-3 py-2 bg-soc-navbar">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-cyan" href="/">
                <i class="fa-solid fa-shield-halved fa-lg"></i>
                <span>AI-NIDS <span class="badge bg-primary text-uppercase fs-7">SOC v1.0</span></span>
            </a>

            <div class="d-flex align-items-center gap-3">
                <span id="sniffer-status-pill" class="badge bg-secondary p-2 d-flex align-items-center gap-2">
                    <span class="status-dot"></span>
                    <span id="sniffer-status-text">Sniffer Idle</span>
                </span>
                <button id="btn-toggle-sniffer" class="btn btn-outline-cyan btn-sm" onclick="toggleSniffer()">
                    <i class="fa-solid fa-play me-1"></i> Start Sniffer
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container Layout -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-none d-md-block sidebar py-3 border-end border-secondary bg-soc-sidebar">
                <div class="nav flex-column gap-2">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                        <i class="fa-solid fa-gauge-high me-2"></i> SOC Dashboard
                    </a>
                    <a href="/alerts" class="nav-link {% if request.path == '/alerts' %}active{% endif %}">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i> Intrusion Alerts
                    </a>
                    <a href="/pcap" class="nav-link {% if request.path == '/pcap' %}active{% endif %}">
                        <i class="fa-solid fa-file-waveform me-2"></i> PCAP Forensics
                    </a>
                    <a href="/threat-lookup" class="nav-link {% if request.path == '/threat-lookup' %}active{% endif %}">
                        <i class="fa-solid fa-globe me-2"></i> Threat Intelligence
                    </a>
                </div>

                <div class="system-status-box mt-5 p-3 rounded border border-secondary text-secondary small">
                    <div class="fw-bold text-light mb-1"><i class="fa-solid fa-microchip me-1 text-cyan"></i> AI Engine</div>
                    <div>Model: Random Forest (Multi-Class)</div>
                    <div>Accuracy: 100.0%</div>
                    <div>Database: SQLite3</div>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        async function toggleSniffer() {
            const btn = document.getElementById("btn-toggle-sniffer");
            const isStarting = btn.innerText.includes("Start");
            const action = isStarting ? "start" : "stop";

            try {
                const res = await fetch("/api/sniffer/toggle", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({action: action})
                });
                const data = await res.json();
                if (data.status === "started") {
                    btn.innerHTML = '<i class="fa-solid fa-stop me-1"></i> Stop Sniffer';
                    btn.className = "btn btn-outline-danger btn-sm";
                    document.getElementById("sniffer-status-pill").className = "badge bg-success p-2 d-flex align-items-center gap-2";
                    document.getElementById("sniffer-status-text").innerText = "Sniffing Live Traffic";
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-play me-1"></i> Start Sniffer';
                    btn.className = "btn btn-outline-cyan btn-sm";
                    document.getElementById("sniffer-status-pill").className = "badge bg-secondary p-2 d-flex align-items-center gap-2";
                    document.getElementById("sniffer-status-text").innerText = "Sniffer Idle";
                }
            } catch (err) {
                console.error("Failed to toggle sniffer:", err);
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
